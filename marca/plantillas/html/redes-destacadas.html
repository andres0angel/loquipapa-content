<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Loquipapas · redes-destacadas</title><style>@font-face{font-family:"Luckiest Guy";src:url(../../tipografia/fuentes/LuckiestGuy-400.woff2) format("woff2")}
@font-face{font-family:"Permanent Marker";src:url(../../tipografia/fuentes/PermanentMarker-400.woff2) format("woff2")}
@font-face{font-family:"Work Sans";font-weight:500;src:url(../../tipografia/fuentes/WorkSans-500.woff2) format("woff2")}
@font-face{font-family:"Work Sans";font-weight:700;src:url(../../tipografia/fuentes/WorkSans-700.woff2) format("woff2")}
@font-face{font-family:"Work Sans";font-weight:900;src:url(../../tipografia/fuentes/WorkSans-900.woff2) format("woff2")}
:root{--crema:#FFF3D6;--rojo:#E2412B;--noche:#1B1726;--papa:#FFC21A;--queso:#FFD84A}
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
html,body{margin:0;padding:0}
body{font-family:"Work Sans",sans-serif;font-weight:500;color:var(--noche)}
.hoja{position:relative;overflow:hidden}
.t{font-family:"Luckiest Guy",sans-serif;font-weight:400;line-height:.95;margin:0}
.m{font-family:"Permanent Marker",cursive;line-height:1;margin:0}
.s{text-shadow:.045em .045em 0 var(--noche)}.sr{text-shadow:.045em .045em 0 var(--rojo)}
.abs{position:absolute}.c{text-align:center}
img{display:block}@page{size:1800px 420px;margin:0}.hoja{width:1800px;height:420px}.dest{display:grid;grid-template-columns:repeat(6,1fr);gap:20px;color:var(--crema);text-align:center;font-size:30px}.circ{width:250px;height:250px;border-radius:50%;border:8px solid var(--rojo);margin:0 auto 14px;display:flex;align-items:center;justify-content:center}</style></head><body><div class="hoja" data-w="1800" data-h="420" data-u="px"><div class="abs" style="inset:0;background:var(--noche)"></div><div class="abs dest" style="inset:40px"><div><div class="circ" style="background:var(--papa)"><img src="../../iconos/svg/icono-papas.svg" style="width:150px" alt=""></div><b>Menú</b></div><div><div class="circ" style="background:var(--crema)"><img src="../../iconos/svg/icono-combo.svg" style="width:150px" alt=""></div><b>Combos</b></div><div><div class="circ" style="background:var(--papa)"><img src="../../iconos/svg/icono-ubicacion.svg" style="width:150px" alt=""></div><b>Dónde</b></div><div><div class="circ" style="background:var(--crema)"><img src="../../iconos/svg/icono-estrella.svg" style="width:150px" alt=""></div><b>Clientes</b></div><div><div class="circ" style="background:var(--papa)"><img src="../../iconos/svg/icono-horario.svg" style="width:150px" alt=""></div><b>Horario</b></div><div><div class="circ" style="background:var(--crema)"><img src="../../iconos/svg/icono-mensaje.svg" style="width:150px" alt=""></div><b>Pedidos</b></div></div></div></body></html>
