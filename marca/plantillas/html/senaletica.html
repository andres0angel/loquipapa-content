<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Loquipapas · senaletica</title><style>@font-face{font-family:"Luckiest Guy";src:url(../../tipografia/fuentes/LuckiestGuy-400.woff2) format("woff2")}
@font-face{font-family:"Permanent Marker";src:url(../../tipografia/fuentes/PermanentMarker-400.woff2) format("woff2")}
@font-face{font-family:"Work Sans";font-weight:500;src:url(../../tipografia/fuentes/WorkSans-500.woff2) format("woff2")}
@font-face{font-family:"Work Sans";font-weight:700;src:url(../../tipografia/fuentes/WorkSans-700.woff2) format("woff2")}
@font-face{font-family:"Work Sans";font-weight:900;src:url(../../tipografia/fuentes/WorkSans-900.woff2) format("woff2")}
:root{--crema:#FFF3D6;--rojo:#E2412B;--noche:#1B1726;--papa:#FFC21A;--queso:#FFD84A}
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
html,body{margin:0;padding:0}
body{font-family:"Work Sans",sans-serif;font-weight:500;color:var(--noche)}
.hoja{position:relative;overflow:hidden}
.t{font-family:"Luckiest Guy",sans-serif;font-weight:400;line-height:.95;margin:0}
.m{font-family:"Permanent Marker",cursive;line-height:1;margin:0}
.s{text-shadow:.045em .045em 0 var(--noche)}.sr{text-shadow:.045em .045em 0 var(--rojo)}
.abs{position:absolute}.c{text-align:center}
img{display:block}@page{size:297mm 210mm;margin:0}.hoja{width:297mm;height:210mm}</style></head><body><div class="hoja" data-w="297" data-h="210" data-u="mm"><div class="abs" style="inset:0;background:var(--crema)"></div><div class="abs" style="inset:12mm;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,1fr);gap:6mm">
<div style="background:var(--papa);border:1.4mm solid var(--noche);border-radius:6mm;display:flex;align-items:center;justify-content:center;gap:5mm;padding:4mm"><span class="t" style="font-size:17mm;color:var(--rojo);text-shadow:.05em .05em 0 var(--noche);">ABIERTO</span></div><div style="background:var(--noche);border:1.4mm solid var(--noche);border-radius:6mm;display:flex;align-items:center;justify-content:center;gap:5mm;padding:4mm"><span class="t" style="font-size:17mm;color:var(--crema);text-shadow:.05em .05em 0 var(--rojo);">CERRADO</span></div>
<div style="background:var(--rojo);border:1.4mm solid var(--noche);border-radius:6mm;display:flex;align-items:center;justify-content:center;gap:5mm;padding:4mm"><img src="../../iconos/svg/icono-mensaje.svg" style="width:22mm" alt=""><span class="t" style="font-size:17mm;color:var(--crema);text-shadow:.05em .05em 0 var(--noche);">PIDE AQUÍ</span></div><div style="background:var(--crema);border:1.4mm solid var(--noche);border-radius:6mm;display:flex;align-items:center;justify-content:center;gap:5mm;padding:4mm"><img src="../../iconos/svg/icono-para-llevar.svg" style="width:22mm" alt=""><span class="t" style="font-size:17mm;color:var(--rojo);text-shadow:.05em .05em 0 var(--noche);">RECOGE AQUÍ</span></div>
<div style="background:var(--papa);border:1.4mm solid var(--noche);border-radius:6mm;display:flex;align-items:center;justify-content:center;gap:5mm;padding:4mm"><img src="../../iconos/svg/icono-segundo-piso.svg" style="width:22mm" alt=""><span class="t" style="font-size:17mm;color:var(--rojo);text-shadow:.05em .05em 0 var(--noche);font-size:13mm">SUBE AL 2º PISO</span></div><div style="background:var(--crema);border:1.4mm solid var(--noche);border-radius:6mm;display:flex;align-items:center;justify-content:center;gap:5mm;padding:4mm"><img src="../../iconos/svg/icono-salsa.svg" style="width:22mm" alt=""><span class="t" style="font-size:17mm;color:var(--rojo);text-shadow:.05em .05em 0 var(--noche);">SALSAS</span></div>
<div style="background:var(--noche);border:1.4mm solid var(--noche);border-radius:6mm;display:flex;align-items:center;justify-content:center;gap:5mm;padding:4mm"><span class="t" style="font-size:17mm;color:var(--papa);text-shadow:.05em .05em 0 var(--rojo);">BAÑOS</span></div><div style="background:var(--rojo);border:1.4mm solid var(--noche);border-radius:6mm;display:flex;align-items:center;justify-content:center;gap:5mm;padding:4mm"><img src="../../iconos/svg/icono-corazon.svg" style="width:22mm" alt=""><span class="t" style="font-size:17mm;color:var(--crema);text-shadow:.05em .05em 0 var(--noche);font-size:12mm">GRACIAS, VUELVE</span></div></div></div></body></html>
