name = "loquipapas-publicador"
main = "src/index.js"
compatibility_date = "2026-01-01"

[triggers]
crons = ["*/5 * * * *"]

[vars]
GRAPH_VERSION = "v26.0"
TIKTOK_PRIVACY = "SELF_ONLY"

[[d1_databases]]
binding = "DB"
database_name = "loquipapas"
database_id = "fd12edc0-2be1-4128-b15e-e7c91690aba2"

[[kv_namespaces]]
binding = "MEDIA_KV"
id = "95a8b486891947a1b6b2c5760b77a043"

# Opcional: usar R2 en vez de KV para archivos de más de 25 MB.
# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "loquipapas-media"
